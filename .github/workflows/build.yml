name: Compilar APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK firmado
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME 2>&1 | tee build.log

      - name: Mostrar errores de compilación
        if: failure()
        shell: bash
        run: |
          msg=$(grep -E '^e: |error:|What went wrong|Could not|Unresolved reference|^> ' build.log | head -60 | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g' || true)
          echo "::error title=Errores de compilacion::${msg}"

      - name: Preparar APK y notas
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk "giuli-tejido-$VERSION_NAME.apk"
          git log -1 --pretty=%B > notes.txt

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Giuli Tejido ${{ env.VERSION_NAME }}
          body_path: notes.txt
          files: giuli-tejido-${{ env.VERSION_NAME }}.apk
          make_latest: true
